# The Facile Studio tool catalog.
#
# `facile` embeds this file at build time and refreshes it from its raw URL on
# main at runtime, so adding a tenth tool never requires anybody to reinstall
# facile. This copy is canonical; there is no second one to keep in sync.
#
# The install fields mirror the config block of the per-repo install.sh by
# design: the two must agree, and identical names make a mismatch visible.
#
# The auth block is transcribed from each CLI's own credential READ path. It is
# not a preference — get one character wrong and facile writes a token the tool
# will never find. Path templates: ~ is $HOME, ${xdgConfig} is $XDG_CONFIG_HOME
# or ~/.config, ${userConfig} is the platform-native config dir (which on macOS
# is ~/Library/Application Support, and is what Rust's dirs::config_dir returns).

version: 1

tools:
  - name: opus
    summary: Project management
    repo: FacileStudio/opus-cli
    branch: main
    bin: opus
    build: rust
    srcSubdir: .
    asset: opus
    skill: opus
    auth:
      kind: token
      defaultServerUrl: http://localhost:1337
      tokenPath: /dashboard/settings/account/developer
      transport: bearer
      store:
        kind: file
        path: ~/.opus.yml
        format: yaml
        tokenField: api_key
        urlField: api_url
        mode: 0o600
        preserve: true
      note: >-
        Opus mints a static API key from Settings > Account > Developer. It is
        the only suite tool with no login endpoint to drive.

  - name: sablier
    summary: Time tracking
    repo: FacileStudio/sablier-cli
    branch: main
    bin: sablier
    build: rust
    srcSubdir: .
    asset: sablier
    skill: sablier
    auth:
      kind: sso
      apiSuffix: /api
      discoveryPath: /auth/config
      transport: bearer
      sso:
        startPath: /auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /auth/oidc/exchange
        requireState: true
      store:
        kind: file
        path: ~/.sablier.yml
        format: yaml
        tokenField: token
        urlField: server_url
        mode: 0o600
        preserve: true

  - name: nuage
    summary: Cloud storage sync
    repo: FacileStudio/nuage-cli
    branch: main
    bin: nuage
    build: rust
    srcSubdir: .
    asset: nuage
    skill: nuage
    auth:
      kind: sso
      apiSuffix: /api
      discoveryPath: /auth/config
      tokenPath: /settings/api
      transport: bearer
      envToken: NUAGE_TOKEN
      envUrl: NUAGE_SERVER_URL
      sso:
        startPath: /auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /auth/oidc/exchange
        requireState: true
      store:
        kind: file
        path: ~/.nuage.yml
        format: yaml
        tokenField: token
        urlField: server_url
        mode: 0o600
        preserve: true
      note: >-
        The config file also holds sync_dir, poll_interval, ignore_patterns and
        selective_sync. Overwriting it wholesale silently resets the user's sync
        directory, so this store is read-modify-write. tokenPath is the fallback
        for a headless box: nuage-cli keeps a --token paste path for one.

  - name: casier
    summary: Secrets and environment variables
    repo: FacileStudio/casier-cli
    branch: main
    bin: casier
    build: rust
    srcSubdir: .
    asset: casier
    skill: casier
    auth:
      kind: sso
      defaultServerUrl: https://casier.facile.studio/api
      apiSuffix: /api
      discoveryPath: /auth/config
      identityPath: /auth/me
      transport: bearer
      envToken: CASIER_TOKEN
      envUrl: CASIER_SERVER_URL
      sso:
        startPath: /auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /auth/oidc/exchange
        requireState: true
      password:
        path: /auth/login
        withEmail: true
        tokenField: token
      store:
        kind: keychain
        keychainService: casier
        keychainAccount: serverUrl
        path: ${userConfig}/casier/config.toml
        format: toml
        urlField: server_url
        mode: 0o644

  - name: capsule
    summary: End-to-end encrypted paste
    repo: FacileStudio/capsule-cli
    branch: main
    bin: capsule
    build: go
    srcSubdir: .
    asset: capsule-cli
    goVersionVar: github.com/FacileStudio/capsule-cli/cmd.version
    skill: capsule
    auth:
      kind: none
      note: >-
        Capsule is zero-knowledge. There is no account, only a per-capsule
        delete token printed when you seal one.

  - name: antenne
    summary: Alert log and delivery targets
    repo: FacileStudio/antenne-cli
    branch: main
    bin: antenne
    build: go
    srcSubdir: .
    asset: antenne-cli
    goVersionVar: github.com/FacileStudio/antenne-cli/cmd.version
    skill: antenne
    auth:
      kind: password
      defaultServerUrl: http://localhost:9090
      discoveryPath: /api/session/public
      transport: cookie
      cookieName: antenne_session
      envUrl: ANTENNE_URL
      password:
        path: /api/login
        withEmail: false
      store:
        kind: file
        path: ${xdgConfig}/antenne/config.json
        format: json
        tokenField: token
        urlField: url
        mode: 0o600
        dirMode: 0o700
        preserve: true
      note: >-
        Antenne authenticates a whole instance with one password and answers
        with a session cookie, not a bearer token. The stored value is the
        antenne_session cookie value.

  - name: journal
    summary: Centralized logging — read, search, tail
    repo: FacileStudio/journal-cli
    branch: main
    bin: journal
    build: go
    srcSubdir: .
    asset: journal-cli
    goVersionVar: github.com/FacileStudio/journal-cli/cmd.version
    skill: journal
    auth:
      kind: sso
      defaultServerUrl: https://journal.facile.studio
      discoveryPath: /api/auth/config
      transport: bearer
      envToken: JOURNAL_TOKEN
      envUrl: JOURNAL_URL
      sso:
        startPath: /api/auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /api/auth/oidc/exchange
        requireState: true
      password:
        path: /api/auth/login
        withEmail: true
        tokenField: token
      store:
        kind: file
        path: ${xdgConfig}/journal/config.yml
        format: yaml
        tokenField: token
        urlField: url
        mode: 0o600
        dirMode: 0o700
        preserve: true
      note: >-
        Journal answers its read API with a porte session bearer token, and its
        discovery endpoint advertises the same /api/auth/config shape as Mycelium
        and casier, so the SSO login flow is identical. A password login reads
        an email and a password (--email/--password); the token rides as a
        bearer on every read. The CLI is read-only after login: ingest is the
        Go SDK's and curl's job.

  - name: courrier
    summary: Self-hosted email — read, search, send
    repo: FacileStudio/courrier-cli
    branch: main
    bin: courrier
    build: go
    srcSubdir: .
    asset: courrier-cli
    goVersionVar: github.com/FacileStudio/courrier-cli/cmd.version
    skill: courrier
    auth:
      kind: sso
      defaultServerUrl: https://courrier.facile.studio
      discoveryPath: /api/auth/config
      transport: bearer
      envToken: COURRIER_TOKEN
      envUrl: COURRIER_SERVER_URL
      sso:
        startPath: /api/auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /api/auth/oidc/exchange
        requireState: true
      password:
        path: /api/auth/login
        withEmail: true
        tokenField: token
      store:
        kind: file
        path: ${xdgConfig}/courrier/config.yml
        format: yaml
        tokenField: token
        urlField: url
        mode: 0o600
        dirMode: 0o700
        preserve: true
      note: >-
        Courrier mounts porte under /api, so the SSO login flow is identical to
        Journal's. Note that SSO_ONLY=true unregisters the local credential routes
        entirely, so /api/auth/login answers 404 rather than 403 there, and
        courrier.facile.studio runs exactly that way. The config file is YAML per
        CLI-STANDARD 6.1 and carries a default_account key beside the token, so
        preserve is required on write.
  - name: mycelium
    summary: Shared agent memory
    repo: FacileStudio/Mycelium
    branch: main
    bin: mycelium
    build: go
    srcSubdir: .
    asset: Mycelium
    goVersionVar: github.com/FacileStudio/Mycelium/cmd.version
    auth:
      kind: sso
      discoveryPath: /api/auth/config
      transport: bearer
      envToken: MYCELIUM_TOKEN
      envUrl: MYCELIUM_URL
      sso:
        startPath: /api/auth/oidc
        portParam: port
        stateParam: cli_state
        extraParams: flow=cli
        callbackWith: code
        callbackPath: /
        exchangePath: /api/auth/oidc/exchange
        requireState: true
      device:
        startPath: /api/auth/device/start
        pollPath: /api/auth/device/poll
      password:
        path: /api/auth/login
        withEmail: false
        tokenField: token
      store:
        kind: file
        path: ~/.mycelium.yml
        format: yaml
        tokenField: token
        urlField: url
        mode: 0o600
        preserve: true
        extra:
          - machine
      note: >-
        Mycelium also keeps space, usage_token, rule_order and agents in the same
        file, so this store is read-modify-write. The separate usage token is
        an Anthropic credential and is none of facile's business. The device
        flow stays for a headless machine with no browser to open, and Mycelium
        advertises it as device_enabled on its discovery endpoint.

  - name: nacelle
    summary: Terminal coding agent
    repo: FacileStudio/nacelle-tui
    branch: main
    bin: nacelle
    build: go
    srcSubdir: .
    asset: nacelle-tui
    goVersionVar: main.version
    auth:
      kind: none
      envToken: ANTHROPIC_API_KEY
      note: >-
        Nacelle is a client of the model APIs, not of a suite server, so there
        is no suite login to drive. It reads ANTHROPIC_API_KEY for its default
        backend and OPENROUTER_API_KEY for -backend openrouter; settings live
        in ~/.nacelle.yml, which facile never writes.

  - name: ardoise
    summary: Invoice and contract PDFs
    repo: FacileStudio/ardoise-cli
    branch: main
    bin: ardoise
    build: bun
    srcSubdir: .
    asset: ardoise
    requires:
      - typst
    skill: ardoise
    auth:
      kind: none
      note: Ardoise runs entirely offline and has no account.

  - name: douane
    summary: Vulnerability sweep — scan, rank, sweep the fleet
    repo: FacileStudio/douane
    branch: main
    bin: douane
    build: go
    srcSubdir: .
    asset: douane
    goVersionVar: github.com/FacileStudio/douane/internal/version.stamp
    auth:
      kind: none
      note: >-
        Douane scans local lockfiles and queries osv.dev plus the KEV and EPSS
        feeds directly. There is no suite server to log into and no credential
        to store; its only network traffic is advisory lookups.
